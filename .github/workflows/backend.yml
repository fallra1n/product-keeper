name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths: ['backend/**', '.github/**']
    
env:
  REGISTRY: cr.yandex/crp66p03h30r3ekibrbe
  IMAGE_NAME: product-keeper

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.24
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./internal/core/...

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Yandex Container Registry
        uses: docker/login-action@v2
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_REGISTRY_KEY }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/infra/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f backend/infra/deployment.yaml -n test
          kubectl rollout restart deployment/product-keeper -n test
          kubectl rollout status deployment/product-keeper -n test --timeout=300s
      - name: Verify deployment
        run: |
          kubectl get pods -n test -l app=product-keeper
