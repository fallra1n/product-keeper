name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths: ['backend/**', '.github/**']

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.24
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./internal/core/...
